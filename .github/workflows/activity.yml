name: Update activity panel

on:
  schedule:
    - cron: "17 21 * * *" # 06:17 JST, once a day
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: activity
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild assets/activity.svg
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/update_activity.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- assets/activity.svg; then
            echo "no change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/activity.svg
          git commit -m "chore: refresh activity panel"
          git push
