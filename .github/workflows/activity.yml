name: Update live panels

on:
  schedule:
    - cron: "17 21 * * *" # 06:17 JST, once a day
  workflow_dispatch:
  watch:
    types: [started] # someone starred this repo: put them on the passengers' train right away

permissions:
  contents: write

concurrency:
  group: activity
  # Not cancelled: someone starring and unstarring in a loop would otherwise keep every run from finishing.
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the head of the branch now: a run that waited behind another one would otherwise redraw on top of the
          # commit before that one's, and its push would not apply
          ref: ${{ github.ref }}
      - name: Rebuild the live panels, project cards and the archive list
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Optional. The token above can list the stars of this repo only; with a read-only personal token
          # stored as the secret STARS_TOKEN, the passengers' train also carries who starred the other repos.
          STARS_TOKEN: ${{ secrets.STARS_TOKEN }}
        run: python3 scripts/update_live.py
      - name: Commit if changed
        run: |
          # README.en.md too: update_live.py rewrites its cards, and a file left changed makes the pull below refuse.
          git add README.md README.en.md assets docs
          if git diff --cached --quiet; then
            echo "no change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh live panels"
          # The train (train.yml) may have moved while this run was drawing.
          git pull --rebase
          git push
