name: Update live panels

on:
  schedule:
    - cron: "17 21 * * *" # 06:17 JST, once a day
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: activity
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rebuild the live panels, project cards and the archive list
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/update_live.py
      - name: Commit if changed
        run: |
          git add README.md assets
          if git diff --cached --quiet; then
            echo "no change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh live panels"
          # The train (train.yml) may have moved while this run was drawing.
          git pull --rebase
          git push
