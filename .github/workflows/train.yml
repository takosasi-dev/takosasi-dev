name: Move the train

# A visitor opens an issue titled "train: 1", "train: 2" or "train: 3" (the signs in README do
# that) and the train on the loop line moves that many stations.
#
# The issue comes from a stranger. Nothing from the event is ever written into a script: the
# title and the login reach scripts/ext_train.py through env only, the script accepts nothing
# but the exact patterns, the body is never read, and the answer is a fixed sentence.

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

# One move at a time. ponytail: GitHub keeps only one waiting run per group, so of several issues
# opened within the same few seconds only the first and the last get an answer. Fine for a toy;
# move to a queue (a label swept by a scheduled run) if that ever matters.
# Only the issues this workflow answers share the group. Every opened issue starts this workflow, and one
# with another title would otherwise take the waiting place of a real one (which then gets no answer).
concurrency:
  group: ${{ startsWith(github.event.issue.title, 'train:') && 'train' || format('train-skip-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  move:
    if: startsWith(github.event.issue.title, 'train:')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the head of main now, not the commit of the moment the issue was opened: the run before this one has pushed
          ref: ${{ github.event.repository.default_branch }}
      - name: Move the train
        env:
          TITLE: ${{ github.event.issue.title }}
          LOGIN: ${{ github.event.issue.user.login }}
        run: python3 scripts/ext_train.py move > "$RUNNER_TEMP/answer.txt"
      - name: Commit if the train moved
        run: |
          git add data/train.json assets/train.svg assets/train-m.svg
          if git diff --cached --quiet; then
            echo "no change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: move the train"
          # The daily run or the ticket office may push at the same moment: a lost race is simply tried again.
          for try in 1 2 3; do
            if git pull --rebase && git push; then
              exit 0
            fi
            sleep 3
          done
          echo "列車を動かせませんでした。少し時間をおいて、もう一度お試しください。" > "$RUNNER_TEMP/answer.txt"
          exit 1
      - name: Answer and close the issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          if [ ! -s "$RUNNER_TEMP/answer.txt" ]; then
            echo "列車を動かせませんでした。少し時間をおいて、もう一度お試しください。" > "$RUNNER_TEMP/answer.txt"
          fi
          gh issue close "$ISSUE" --repo "$GITHUB_REPOSITORY" --comment "$(cat "$RUNNER_TEMP/answer.txt")"
