<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="100%" role="img" aria-label="takosasi-dev - infrastructure, network, security, games and tools">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a1020"/><stop offset=".7" stop-color="#05070d"/><stop offset="1" stop-color="#12041a"/></linearGradient>
<linearGradient id="scan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#00e5ff" stop-opacity="0"/><stop offset=".85" stop-color="#00e5ff" stop-opacity=".16"/><stop offset="1" stop-color="#00e5ff" stop-opacity=".5"/></linearGradient>
<linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#05070d"/><stop offset="1" stop-color="#05070d" stop-opacity="0"/></linearGradient>
<linearGradient id="ttl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#bfefff"/></linearGradient>
<radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#00e5ff" stop-opacity=".22"/><stop offset="1" stop-color="#00e5ff" stop-opacity="0"/></radialGradient>
<linearGradient id="sw" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#39ff88" stop-opacity="0"/><stop offset="1" stop-color="#39ff88" stop-opacity=".55"/></linearGradient>
<pattern id="hex" width="45.03" height="78" patternUnits="userSpaceOnUse"><path d="M22.52 0L45.03 13.0L45.03 39.0L22.52 52L0 39.0L0 13.0ZM22.52 52L22.52 78" fill="none" stroke="#00e5ff" stroke-opacity="0.085" stroke-width="1"/></pattern>
<pattern id="lines" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000" opacity=".28"/></pattern>
<clipPath id="c"><rect width="1200" height="440" rx="16"/></clipPath>
<clipPath id="slice"><rect x="0" y="168" width="1200" height="22"/></clipPath>
<clipPath id="tk"><rect x="0" y="408" width="1200" height="32"/></clipPath>
