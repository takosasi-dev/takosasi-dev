<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" role="img" aria-label="Animated network topology: internet, WAF and IDS, core switch, Linux, Windows Server, VMware and AWS">
<defs><pattern id="gr" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#00e5ff" stroke-opacity=".07"/></pattern>
